<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">WatermarkPro portfolio banner</title>
<desc id="desc">Graphic brand illustration, not a screenshot of the application. WatermarkPro: offline watermarking, batch workflows, carefully tested.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243B"/><stop offset=".55" stop-color="#142B3D"/><stop offset="1" stop-color="#10413F"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9AF4DB"/><stop offset="1" stop-color="#77BCE8"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25445B"/><stop offset="1" stop-color="#1A3346"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.15" fill="#83D8C4" opacity=".12"/></pattern>
</defs>
<rect width="1200" height="380" rx="28" fill="url(#bg)"/>
<rect width="1200" height="380" rx="28" fill="url(#dots)"/>
